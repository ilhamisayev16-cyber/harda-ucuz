name: Scrape Prices Daily

on:
  schedule:
    - cron: '0 2 * * *'   # 06:00 Bakı vaxtı
  workflow_dispatch:
    inputs:
      store:
        description: 'Mağaza (all, araz, oba, bravo, neptun, tamstore, rahat, bazarstore, spar)'
        default: 'all'

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # ~50 Wolt filialının kataloqu uzun çəkir (GitHub limiti 360)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1 (commit SHA ilə: teq dəyişdirilsə də başqa kod işləmir; Dependabot yeniləyir)
        with:
          persist-credentials: false   # token .git/config-da qalmasın (aşağıda yalnız yükləmə addımına verilir)
          ref: ${{ github.ref_name }}   # işə düşdüyü andakı commit yox, ən son vəziyyət: növbədə gözləyəndən sonra köhnə kod/data ilə qurmasın

      - name: Python quraşdır
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Asılılıqları yüklə
        run: pip install --require-hashes -r requirements.txt   # hash-lər requirements.txt-dədir: dəyişdirilmiş paket quraşdırılmır

      - name: Scraper işlət
        timeout-minutes: 300   # aşarsa da hazır olan mağazalar aşağıda commit olunur
        env:
          PYTHONUNBUFFERED: "1"
          WOLT_ENABLED: ${{ vars.WOLT_ENABLED || '1' }}   # Settings → Variables → WOLT_ENABLED=0: Wolt sorğuları dayandırılır (köhnə data silinmir)
          STORE: ${{ github.event.inputs.store || 'all' }}   # input birbaşa shell-ə qoyulmur (injection-a qarşı)
        run: |
          case "$STORE" in
            all|araz|oba|bravo|neptun|tamstore|rahat|bazarstore|spar) ;;
            *) echo "Naməlum mağaza: $STORE"; exit 1 ;;
          esac
          python scrapers/scraper.py --store "$STORE"

      - name: Məhsul şəkilləri (Open Food Facts, ştrix-koda görə)
        if: always()   # scrape vaxtı bitsə də; alınmasa sayt ikon göstərir
        continue-on-error: true
        timeout-minutes: 30
        run: python scrapers/off_images.py

      # Scrape ~2.5 saat çəkir; bu vaxt main-ə kod gələ bilər. Əvvəl köhnə kodla qurulmuş fayllar (groups.json, qiymetler/, mehsullar/ ...)
      # qiymətlərlə birlikdə commit olunurdu və rebase-də konflikt verirdi: push alınmır, günün qiymətləri itirdi (2026-10-26, PR #62 merge).
      # İndi yalnız data commit olunub ən son main-in üzərinə keçirilir, sayt isə ondan sonra ən son kodla qurulur.
      - name: Qiymətləri commit et, ən son main-ə keçir
        if: always()   # scrape vaxtı bitsə də yazılmış data üçün
        run: |
          git config user.name "Price Bot"
          git config user.email "bot@qiymet.az"
          git add data/prices.json data/history.json
          if [ -e data/off_images.json ]; then git add data/off_images.json; fi
          git diff --staged --quiet || git commit -m "Qiymətlər yeniləndi"
          git reset -q --hard && git clean -fdq   # commit olunmamış qalıqlar (yaradılan fayllar) rebase-ə mane olmasın
          git pull --rebase origin "$GITHUB_REF_NAME"   # açıq repo: token lazım deyil

      - name: Saytı qur (hazır kartlar, statik səhifələr, sitemap)
        if: always()
        timeout-minutes: 10
        run: |
          node scripts/build_site.js
          for f in data/groups.json data/product_ids.json data/catalog.json data/catalog sitemap.xml sitemap-products*.xml robots.txt mehsullar qiymetler; do if [ -e "$f" ]; then git add -A "$f"; fi; done
          git diff --staged --quiet || git commit -m "Sayt yenidən quruldu"

      - name: Nəticəni GitHub-a yüklə
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # yazma tokeni yalnız bu addımda: əvvəlki addımlar (pip paketləri, scraper, qurma) onu görmür
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push || { git pull --rebase origin "$GITHUB_REF_NAME" && git push; }   # bu arada yeni commit gəlibsə bir dəfə təkrar
