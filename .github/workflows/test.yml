name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1 (commit SHA ilə: teq dəyişdirilsə də başqa kod işləmir; Dependabot yeniləyir)
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install --require-hashes -r requirements.txt && pip install pytest
      - run: python -m py_compile scrapers/scraper.py scrapers/sources.py
      - run: python -m pytest tests -q
