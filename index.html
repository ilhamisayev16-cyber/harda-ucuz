<!doctype html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QiymətMüqayisə — Bakı supermarket qiymətləri</title>
<meta name="description" content="Bravo, OBA, Araz və Neptun supermarketlərinin qiymətlərini bir yerdə müqayisə edin.">
<meta name="theme-color" content="#e35600">
<link rel="preload" href="data/prices.json" as="fetch" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛒%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#faf6ee; --card:#fff; --ink:#281505; --mute:#6b5a46; --line:#eedcc4; --soft:#f6efe2;
  --brand:#e35600; --brand-soft:#fff1e6; --good:#0f9d58; --good-soft:#e6f6ee; --bad:#d93025;
  --Bravo:#d93025; --OBA:#0b79d0; --Araz:#8e44ad; --Neptun:#0f9d58;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151009; --card:#1f1810; --ink:#f5ebdc; --mute:#b4a58f; --line:#3a2e20; --soft:#2a2118;
  --brand:#ff7a2f; --brand-soft:#33210f; --good:#3ddc84; --good-soft:#12301f; --bad:#ff6b5e;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:960px;margin:0 auto;padding:0 14px 48px}
.mono{font-variant-numeric:tabular-nums}

/* header: logo + search on one row */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px}
.logo{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:12px;border:0;
  background:var(--ink);color:var(--bg);font-size:20px;padding:0}
.logo-t{display:none;font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo-t b{color:var(--brand)}
.search{position:relative;flex:1}
.search input{width:100%;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;
  padding:0 12px 0 38px;outline:none}
.search input:focus{border-color:var(--brand)}
.search:before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.7}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.2);max-height:65vh;overflow:auto}
.results:empty{display:none}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.res:last-child{border:0}
.res:active{background:var(--soft)}
.res small{color:var(--mute);display:block}
.res strong{display:block;font-size:15px}

/* home */
h1.hero{margin:18px 0 4px;font-size:24px;letter-spacing:-.03em;line-height:1.15}
.sub-h{margin:0 0 16px;color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;
  display:flex;align-items:center;gap:10px;min-height:64px;min-width:0}
.cat:active{border-color:var(--brand);background:var(--brand-soft)}
.cat .em{font-size:28px;line-height:1;flex:none}
.cat span:last-child{min-width:0}
.cat b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat small{color:var(--mute);font-size:12px}
.note{margin-top:20px;color:var(--mute);font-size:12.5px;line-height:1.6}

/* category view */
.bar{display:flex;align-items:center;gap:10px;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:0 16px;font-weight:600}
.btn:active{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.title{margin:0;font-size:22px;letter-spacing:-.02em;line-height:1.2;min-width:0}
.champ{background:var(--good-soft);color:var(--good);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 12px;padding:0 14px}
.scroll::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:38px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;
  font-size:14px;font-weight:600;color:var(--mute);white-space:nowrap}
.pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input,.tools select,.fx input{height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;outline:none;min-width:0}
.tools input{flex:1}
.tools input:focus,.fx input:focus{border-color:var(--brand)}
details.more-f{margin-bottom:10px}
details.more-f summary{list-style:none;cursor:pointer;color:var(--brand);font-weight:600;font-size:14px;padding:6px 0}
details.more-f summary::-webkit-details-marker{display:none}
.fx{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:6px;display:grid;gap:10px}
.fx .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fx input{width:calc(50% - 4px)}
.lbl{font-size:12px;color:var(--mute);width:100%}
.count{color:var(--mute);font-size:13px;margin:0 0 8px}

/* product cards */
.list{display:grid;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.item.hl{background:var(--brand-soft);border-color:var(--brand)}
.head{display:flex;gap:12px;align-items:center}
.logo-p{flex:none;width:52px;height:52px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:28px}
.head>div{min-width:0}
.item h3{margin:0;font-size:15px;line-height:1.3;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--mute);margin-top:2px}
.best{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 8px;padding:10px 12px;
  background:var(--good-soft);border-radius:12px;color:var(--good)}
.best>span{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.best b{font-size:20px;font-weight:800;white-space:nowrap}
.best small{display:block;font-size:11px;font-weight:600;opacity:.85}
.offers{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.o{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.o span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.o b{font-size:15px}
.o.min{border-color:var(--good)}
.o.min b{color:var(--good)}
.o.max b{color:var(--bad)}
.o.na{opacity:.45}
.o sup{font-size:9px;color:var(--mute);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,#999);flex:none}
.more{display:block;margin:16px auto 0;width:100%}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}

.skel{border-radius:14px;background:linear-gradient(90deg,var(--soft) 25%,var(--line) 50%,var(--soft) 75%);
  background-size:400% 100%;animation:sh 1.4s infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.err{padding:40px 16px;text-align:center}
[hidden]{display:none!important}

@media (min-width:600px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .logo-t{display:block}
  .logo{display:none}
  .top .wrap{gap:18px}
  .search{max-width:480px;margin-left:auto}
  .list{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:900px){ .grid{grid-template-columns:repeat(4,1fr)} }
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <button class="logo" id="home" aria-label="Ana səhifə">🛒</button>
  <span class="logo-t" id="home2">Qiymət<b>Müqayisə</b></span>
  <div class="search">
    <input id="q" type="search" placeholder="Məhsul axtar: süd, banan…" autocomplete="off" aria-label="Axtarış">
    <div class="results" id="results" role="listbox"></div>
  </div>
</div></header>

<main class="wrap">
  <div id="loading">
    <div class="skel" style="height:30px;width:70%;margin:18px 0 16px"></div>
    <div class="grid" id="skelgrid"></div>
  </div>

  <div id="error" class="err" hidden>
    <div style="font-size:42px">⚠️</div>
    <p><b>Məlumat yüklənmədi</b><br><span id="errmsg" class="mono" style="color:var(--mute)"></span></p>
    <button class="btn primary" id="retry">Yenidən cəhd et</button>
  </div>

  <section id="homeView" hidden>
    <h1 class="hero">Hansı market daha ucuzdur?</h1>
    <p class="sub-h">Bravo, OBA, Araz və Neptun qiymətləri bir yerdə. Kateqoriya seç:</p>
    <div class="grid" id="catGrid"></div>
    <p class="note" id="srcNote"></p>
  </section>

  <section id="catView" hidden>
    <div class="bar">
      <button class="btn" id="back" aria-label="Geri">←</button>
      <h1 class="title"><span id="catEm"></span> <span id="catName"></span></h1>
    </div>
    <div class="champ" id="champ" hidden></div>
    <div class="scroll" id="subs"></div>
    <div class="tools">
      <input id="tq" type="search" placeholder="Siyahıda süz…" aria-label="Siyahıda süz">
      <select id="sort" aria-label="Sıralama">
        <option value="savings_desc">Qənaət</option>
        <option value="price_asc">Ucuz</option>
        <option value="name">A → Z</option>
      </select>
    </div>
    <details class="more-f">
      <summary>⚙ Ölçü və yağ filtri</summary>
      <div class="fx">
        <div class="row"><span class="lbl">Ölçü</span><div class="row" id="modes"></div>
          <input id="minW" type="number" inputmode="numeric" min="0" placeholder="Min q/ml" aria-label="Minimum çəki">
          <input id="maxW" type="number" inputmode="numeric" min="0" placeholder="Maks q/ml" aria-label="Maksimum çəki"></div>
        <div class="row" id="fatRow"><span class="lbl">Yağ faizi</span><div class="row" id="fats"></div></div>
      </div>
    </details>
    <p class="count" id="count"></p>
    <div class="list" id="list"></div>
    <button class="btn primary more" id="more" hidden>Daha çox göstər</button>
    <p class="note"><b style="color:var(--good)">Yaşıl</b> — ən ucuz, <b style="color:var(--bad)">qırmızı</b> — ən baha.
      <sup>W</sup> — qiymət Wolt-dan götürülüb, rəf qiymətindən bir qədər yüksək ola bilər.</p>
  </section>
</main>

<script>
"use strict";
/* ─────────── constants ─────────── */
const EMOJI={sud:"🥛",yumurta:"🥚",kere_yagi:"🧈",pendir:"🧀",qatiq:"🫙",xama:"🥄",kefir:"🥛",ayran:"🥤",
  kartof:"🥔",pomidor:"🍅",xiyar:"🥒",soyan:"🧅",kelem:"🥬",yerkoyu:"🥕",cuqundur:"🫚",badimcan:"🍆",biber:"🌶️",
  sarimsaq:"🧄",alma:"🍎",armud:"🍐",saftal:"🍑",gilas:"🍒",uzum:"🍇",banan:"🍌",kivi:"🥝",limon:"🍋",
  portaqal:"🍊",nar:"🍎",toyuq:"🍗",dana_ati:"🥩",qoyun_ati:"🍖",hindi:"🦃",kolbasa:"🌭",sosis:"🌭",baliq:"🐟",
  duyu:"🍚",merci:"🫘",noxud:"🟡",fasulya:"🫘",qarabashaq:"🌾",yulaf:"🌾",un:"🌾",makaron:"🍝",corek:"🍞",
  pecenye:"🍪",cay:"🍵",qehve:"☕",sire:"🧃",su:"💧",kola:"🥤",energetik:"⚡",sokolad:"🍫",halva:"🍬",bal:"🍯",
  dondurma:"🍦",zeytun_yagi:"🫒",bitki_yagi:"🌻",mayonez:"🫙",ketcup:"🍅",duz:"🧂",sekerqum:"🍬",istiot:"🌶️"};
const PAGE=60;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n.toFixed(2)+" ₼";

/* ─────────── matching / attribute extraction ─────────── */
const TR={"ç":"c","ə":"e","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u"};
function tokens(str){
  return new Set(str.toLowerCase().replace(/[çəğıöşü]/g,c=>TR[c]).replace(/[^\w\s]/g," ").split(/\s+/).filter(Boolean));
}
function jaccard(a,b){
  let i=0; for(const t of a) if(b.has(t)) i++;
  const u=a.size+b.size-i; return u?i/u:1;
}
const STOP=new Set(["sabun","şampun","yuyucu","dezodorant","krem","losyon","jel","maye","plastik","şüşə","qabda","qalib",
  "mini","maxi","vita","nano","bio","eco","premium","classic","original","special","super","ultra","mega","extra",
  "ve","ilə","üçün","olan","həm","da","də","ki","bu","bir","bütün"]);
const isAdj=w=>/[lL][ıiuüIİUÜ]$/.test(w);
const AL="[a-zA-ZğüşıöçĞÜŞIÖÇəƏ]";
function productType(name){
  const m=name.match(new RegExp("\\d[\\d.,]*\\s*(?:%|kq|kg|litr|lt(?!"+AL+")|ml(?!"+AL+")|[lL](?!"+AL+")|[qQgG][rR]?(?!"+AL+"))"));
  const before=name.slice(0,m?m.index:name.length).trim();
  const w=(before||name).split(/\s+/).filter(x=>/^\p{L}+$/u.test(x));
  if(!w.length) return "Digər";
  const up=x=>x[0].toUpperCase()+x.slice(1);
  if(w.length<2) return up(w[0]);
  for(let i=1;i<w.length;i++){ if(isAdj(w[i])||STOP.has(w[i].toLowerCase())) continue; return up(w[i]); }
  return up(w[w.length-1]);
}
const WPATS=[[/(\d+[.,]?\d*)\s*kq(?!AL)/i,"kq"],[/(\d+[.,]?\d*)\s*kg(?!AL)/i,"kq"],[/(\d+[.,]?\d*)\s*litr/i,"L"],
  [/(\d+[.,]?\d*)\s*lt(?!AL)/i,"L"],[/(\d+[.,]?\d*)\s*[lL](?!AL)/,"L"],[/(\d+[.,]?\d*)\s*ml(?!AL)/i,"ml"],
  [/(\d+[.,]?\d*)\s*gr(?!AL)/i,"q"],[/(\d+[.,]?\d*)\s*[gG](?!AL)/,"q"],[/(\d+[.,]?\d*)\s*qr?(?!AL)/i,"q"]]
  .map(([r,u])=>[new RegExp(r.source.replace(/AL/g,AL),r.flags),u]);
function attrs(name){
  let fat=null; const f=name.match(/(\d+[.,]?\d*)\s*%/);
  if(f){const v=parseFloat(f[1].replace(",","."));if(!isNaN(v))fat=v;}
  let wv=null,wu=null;
  for(const [re,u] of WPATS){const m=name.match(re); if(m){const v=parseFloat(m[1].replace(",","."));if(v>0){wv=v;wu=u;break;}}}
  if(!wv){
    if(/10-luq|10\s*[əea]d[əe]d|10\s*adet/i.test(name)){wv=10;wu="ədəd";}
    else if(/15-lik|15\s*[əe]d[əe]d/i.test(name)){wv=15;wu="ədəd";}
    else if(/30-luq|30\s*[əe]d[əe]d/i.test(name)){wv=30;wu="ədəd";}
    else if(/6-l[ıi]q|6\s*[əe]d[əe]d/i.test(name)){wv=6;wu="ədəd";}
  }
  return {subtype:productType(name),wv,wu,fat};
}
const norm=(v,u)=>v==null||!u?null:(u==="kq"||u==="L")?v*1000:v;

/* group products across stores (inverted index: only compare names that share a token) */
function group(cat){
  const out=[], idx=new Map(); let n=1;
  for(const store of Object.keys(cat.stores||{})){
    for(const it of cat.stores[store]||[]){
      const tk=tokens(it.name); let best=null,bs=0; const seen=new Set();
      for(const t of tk){
        const l=idx.get(t); if(!l) continue;
        for(const e of l){ if(seen.has(e)) continue; seen.add(e);
          const s=jaccard(e.tk,tk); if(s>bs){bs=s;best=e.g;} }
      }
      if(best&&bs>=.5){ if(!best.offers[store]) best.offers[store]=mk(it); continue; }
      const g={id:"p"+n++,name:it.name,a:attrs(it.name),offers:{[store]:mk(it)},lc:it.name.toLowerCase()};
      out.push(g); const e={g,tk};
      for(const t of tk){ (idx.get(t)||idx.set(t,[]).get(t)).push(e); }
    }
  }
  for(const g of out){ // precompute price stats once
    const v=Object.values(g.offers).map(o=>o.p);
    g.n=v.length; g.min=Math.min(...v); g.max=Math.max(...v); g.save=g.n>1?g.max-g.min:0;
  }
  return out;
}
function mk(it){ const own=it.price!=null; return {p:own?it.price:(it.wolt_price||0), w:!own}; }

/* ─────────── state ─────────── */
let DB=null; const GROUPS={}; let stores=[];
let cur=null, filtered=[], shown=PAGE, hl=null;
const F={sub:null,mode:"Hamısı",min:"",max:"",fat:null,q:"",sort:"savings_desc"};
const groups=id=>GROUPS[id]||(GROUPS[id]=group(DB.categories[id]));

/* ─────────── load ─────────── */
async function load(){
  $("loading").hidden=false; $("error").hidden=true;
  try{
    const r=await fetch("data/prices.json"); if(!r.ok) throw new Error("HTTP "+r.status);
    DB=await r.json(); stores=DB.stores||[];
    renderHome(); route();
  }catch(e){ $("errmsg").textContent=e.message; $("error").hidden=false; }
  finally{ $("loading").hidden=true; }
}

/* ─────────── home ─────────── */
function renderHome(){
  const raw=id=>Object.values(DB.categories[id].stores).reduce((a,l)=>a+l.length,0);
  const cats=Object.entries(DB.categories).filter(([id])=>raw(id)>0).sort((a,b)=>raw(b[0])-raw(a[0]));
  $("catGrid").innerHTML=cats.map(([id,c])=>
    `<button class="cat" data-id="${id}"><span class="em">${EMOJI[id]||"📦"}</span><span><b>${esc(c.name)}</b>
     <small>${raw(id)} qiymət</small></span></button>`).join("");
  $("srcNote").innerHTML=`Son yenilənmə: <b>${esc(DB.last_updated||"—")}</b>. Mağazanın öz saytından alınan qiymətlər dəqiqdir;
    Wolt-dan alınanlar <sup>W</sup> ilə işarələnib və rəfdəki qiymətdən bir qədər yüksək ola bilər.`;
}

/* ─────────── category view ─────────── */
function openCat(id,focus){
  cur=id; hl=focus||null; shown=PAGE;
  Object.assign(F,{sub:null,mode:"Hamısı",min:"",max:"",fat:null,q:"",sort:"savings_desc"});
  $("minW").value=$("maxW").value=$("tq").value=""; $("sort").value=F.sort;
  document.querySelector("details.more-f").open=false;
  $("catEm").textContent=EMOJI[id]||"📦"; $("catName").textContent=DB.categories[id].name;
  const gs=groups(id), subs=new Map(), fats=new Set();
  gs.forEach(g=>{subs.set(g.a.subtype,(subs.get(g.a.subtype)||0)+1); if(g.a.fat!=null)fats.add(g.a.fat);});
  const top=[...subs].sort((a,b)=>b[1]-a[1]).slice(0,40).map(x=>x[0]).sort((a,b)=>a.localeCompare(b,"az"));
  $("subs").innerHTML=pill("Hamısı",null,"sub")+top.map(s=>pill(s,s,"sub")).join("");
  $("modes").innerHTML=["Hamısı","⚖ Çəki","💧 Həcm","📦 Digər"].map(m=>pill(m,m,"mode")).join("");
  const fl=[...fats].sort((a,b)=>a-b); $("fatRow").hidden=fl.length<2;
  $("fats").innerHTML=fl.length<2?"":pill("Hamısı",null,"fat")+fl.map(f=>pill(f+"%",f,"fat")).join("");
  const cnt={}; gs.forEach(g=>{ if(g.n<2)return; for(const[s,o]of Object.entries(g.offers)) if(o.p===g.min) cnt[s]=(cnt[s]||0)+1; });
  const ch=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  $("champ").hidden=!ch; if(ch) $("champ").textContent=`🏆 Ən sərfəli: ${ch[0]} (${ch[1]} məhsulda ən ucuz)`;
  syncPills(); apply();
}
const pill=(label,val,k)=>`<button class="pill" data-k="${k}" data-v="${val==null?"":esc(val)}">${esc(label)}</button>`;
function syncPills(){
  document.querySelectorAll("#catView .pill").forEach(b=>{
    const k=b.dataset.k, v=b.dataset.v, cv=F[k];
    b.classList.toggle("on",(cv==null&&v==="")||(cv!=null&&String(cv)===v));
  });
}
function apply(){
  let l=groups(cur).slice();
  if(F.sub) l=l.filter(g=>g.a.subtype===F.sub);
  if(F.mode!=="Hamısı") l=l.filter(g=>{const u=g.a.wu;
    return F.mode==="⚖ Çəki"?(u==="kq"||u==="q"):F.mode==="💧 Həcm"?(u==="L"||u==="ml"):(u==="ədəd"||u==null);});
  const mn=parseFloat(F.min), mx=parseFloat(F.max);
  if(!isNaN(mn)) l=l.filter(g=>{const n=norm(g.a.wv,g.a.wu);return n!=null&&n>=mn;});
  if(!isNaN(mx)) l=l.filter(g=>{const n=norm(g.a.wv,g.a.wu);return n!=null&&n<=mx;});
  if(F.fat!=null) l=l.filter(g=>g.a.fat===+F.fat);
  if(F.q.trim()){const q=F.q.trim().toLowerCase(); l=l.filter(g=>g.lc.includes(q)||g.a.subtype.toLowerCase().includes(q));}
  if(F.sort==="name") l.sort((a,b)=>a.name.localeCompare(b.name,"az"));
  else if(F.sort==="price_asc") l.sort((a,b)=>a.min-b.min);
  else l.sort((a,b)=>b.save-a.save||b.n-a.n);
  filtered=l; shown=Math.max(shown,PAGE); render();
}
function offer(g,s){
  const o=g.offers[s], c0=`<i class="dot" style="--c:var(--${s})"></i>${s}`;
  if(!o) return `<div class="o na"><span>${c0}</span><b>—</b></div>`;
  const c=g.n>1?(o.p===g.min?" min":o.p===g.max?" max":""):"";
  return `<div class="o${c}"><span>${c0}</span><b class="mono">${fmt(o.p)}${o.w?"<sup>W</sup>":""}</b></div>`;
}
function bestOf(g){
  const e=Object.entries(g.offers).sort((x,y)=>x[1].p-y[1].p)[0];
  const sv=g.n>1?`<small>${fmt(g.save)} qənaət (ən bahadan)</small>`:`<small>yalnız bu mağazada</small>`;
  return `<div class="best"><span><i class="dot" style="--c:var(--${e[0]})"></i><span style="display:block">Ən ucuz: ${e[0]}${sv}</span></span><b class="mono">${fmt(e[1].p)}</b></div>`;
}
function render(){
  const list=filtered.slice(0,shown), em=EMOJI[cur]||"📦";
  $("count").textContent=`${filtered.length} məhsul`;
  $("list").innerHTML=list.length?list.map(g=>{
    const a=g.a, info=[a.wv?`${a.wv} ${a.wu}`:"",a.fat!=null?a.fat+"%":""].filter(Boolean).join(" · ");
    return `<article class="item${hl===g.id?" hl":""}" id="r-${g.id}">
      <div class="head"><div class="logo-p">${em}</div><div><h3>${esc(g.name)}</h3><div class="meta">${esc(info||a.subtype)}</div></div></div>
      ${bestOf(g)}<div class="offers">${stores.map(s=>offer(g,s)).join("")}</div></article>`;
  }).join(""):'<div class="empty">Filtrə uyğun məhsul tapılmadı.</div>';
  $("more").hidden=shown>=filtered.length;
  $("more").textContent=`Daha çox göstər (${filtered.length-shown} qalıb)`;
}

/* ─────────── routing (hash) ─────────── */
function route(){
  if(!DB) return;
  const m=location.hash.match(/^#\/c\/([\w-]+)(?:\/(p\d+))?/);
  if(m&&DB.categories[m[1]]){
    $("homeView").hidden=true; $("catView").hidden=false; openCat(m[1],m[2]);
    if(m[2]) setTimeout(()=>{const r=$("r-"+m[2]); r&&r.scrollIntoView({block:"center"});},50);
    else window.scrollTo(0,0);
  }else{ $("catView").hidden=true; $("homeView").hidden=false; }
}
addEventListener("hashchange",route);
const go=h=>{ location.hash===h?route():(location.hash=h); };

/* ─────────── events ─────────── */
const goHome=()=>{ $("q").value=""; $("results").innerHTML=""; go("#/"); };
$("home").onclick=$("home2").onclick=goHome;
$("back").onclick=()=>go("#/");
$("retry").onclick=load;
$("catGrid").onclick=e=>{const b=e.target.closest(".cat"); if(b) go("#/c/"+b.dataset.id);};
$("catView").addEventListener("click",e=>{
  const b=e.target.closest(".pill"); if(!b) return;
  const k=b.dataset.k, v=b.dataset.v;
  F[k]=k==="mode"?v:(v===""?null:v); syncPills(); hl=null; shown=PAGE; apply();
});
$("more").onclick=()=>{shown+=PAGE;render();};
const debounce=(f,t=120)=>{let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>f(...a),t);};};
$("minW").oninput=debounce(e=>{F.min=e.target.value;shown=PAGE;apply();});
$("maxW").oninput=debounce(e=>{F.max=e.target.value;shown=PAGE;apply();});
$("tq").oninput=debounce(e=>{F.q=e.target.value;shown=PAGE;apply();});
$("sort").onchange=e=>{F.sort=e.target.value;apply();};

/* global search */
$("q").oninput=debounce(e=>{
  const q=e.target.value.trim().toLowerCase(), box=$("results");
  if(q.length<2){box.innerHTML="";return;}
  const res=[];
  for(const id of Object.keys(DB.categories)){
    for(const g of groups(id)){
      if(g.lc.includes(q)) res.push([id,g]);
      if(res.length>=400) break;
    }
  }
  res.sort((a,b)=>b[1].n-a[1].n||a[1].min-b[1].min);
  box.innerHTML=res.slice(0,8).map(([id,g])=>
    `<button class="res" data-go="#/c/${id}/${g.id}"><small>${EMOJI[id]||"📦"} ${esc(DB.categories[id].name)}</small>
     <strong>${esc(g.name)}</strong><small class="mono">${Object.entries(g.offers).map(([s,o])=>s+" "+fmt(o.p)).join(" · ")}</small></button>`).join("")
     ||'<div class="res"><small>Heç nə tapılmadı</small></div>';
},150);
$("results").onclick=e=>{const b=e.target.closest("[data-go]"); if(!b)return; $("results").innerHTML=""; $("q").value=""; go(b.dataset.go);};
addEventListener("keydown",e=>{ if(e.key==="Escape"){$("results").innerHTML="";$("q").blur();} });
addEventListener("click",e=>{ if(!e.target.closest(".search")) $("results").innerHTML=""; });

$("skelgrid").innerHTML=Array(8).fill('<div class="skel" style="height:64px"></div>').join("");
load();
</script>
</body>
</html>
