name: Build Site

# Sayt kodu (index.html) və ya qurma skripti dəyişəndə hazır kartlar və statik səhifələr yenidən qurulur:
# data/groups.json saytın kod versiyasına bağlıdır, köhnəsi qəbul olunmur (sayt onda kartları özü hesablayır, yavaş).
# Gündəlik scrape eyni addımı özü işlədir (bot commit-ləri başqa workflow-u işə salmır).
on:
  push:
    branches: [main]
    paths: ['index.html', 'scripts/**', 'assets/catalog.css', 'sw.js']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape   # scrape ilə eyni anda işləmir (eyni faylları commit edir)
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1 (commit SHA ilə: teq dəyişdirilsə də başqa kod işləmir; Dependabot yeniləyir)
        with:
          persist-credentials: false   # token .git/config-da qalmasın (aşağıda yalnız yükləmə addımına verilir)
          ref: ${{ github.ref_name }}   # işə düşdüyü andakı commit yox, ən son vəziyyət: növbədə gözləyəndən sonra köhnə kod/data ilə qurmasın

      - name: Saytı qur
        run: node scripts/build_site.js

      - name: GitHub-a yüklə
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # yazma tokeni yalnız bu addımda: qurma addımı onu görmür
        run: |
          git config user.name "Price Bot"
          git config user.email "bot@qiymet.az"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for f in data/groups.json data/product_ids.json data/catalog.json data/catalog sitemap.xml sitemap-products*.xml robots.txt mehsullar qiymetler; do if [ -e "$f" ]; then git add -A "$f"; fi; done   # qurma alınmasa da qiymətlər commit olunsun
          git diff --staged --quiet || git commit -m "Sayt yenidən quruldu"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
