name: Scrape Prices Daily

on:
  schedule:
    - cron: '0 2 * * *'   # 06:00 Bakı vaxtı
  workflow_dispatch:
    inputs:
      store:
        description: 'Mağaza (all, araz, oba, bravo, neptun, tamstore, rahat, bazarstore)'
        default: 'all'

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Python quraşdır
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Asılılıqları yüklə
        run: pip install -r requirements.txt

      - name: Scraper işlət
        timeout-minutes: 85   # aşarsa da hazır olan mağazalar aşağıda commit olunur
        env:
          PYTHONUNBUFFERED: "1"
          WOLT_ENABLED: ${{ vars.WOLT_ENABLED || '1' }}   # Settings → Variables → WOLT_ENABLED=0: Wolt sorğuları dayandırılır (köhnə data silinmir)
          STORE: ${{ github.event.inputs.store || 'all' }}   # input birbaşa shell-ə qoyulmur (injection-a qarşı)
        run: |
          case "$STORE" in
            all|araz|oba|bravo|neptun|tamstore|rahat|bazarstore) ;;
            *) echo "Naməlum mağaza: $STORE"; exit 1 ;;
          esac
          python scrapers/scraper.py --store "$STORE"

      - name: Nəticəni GitHub-a yüklə
        if: always()
        run: |
          git config user.name "Price Bot"
          git config user.email "bot@qiymet.az"
          git add data/prices.json data/history.json
          git diff --staged --quiet || git commit -m "Qiymətlər yeniləndi"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
